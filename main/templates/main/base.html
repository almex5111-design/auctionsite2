<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Аукцион{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    
    <nav class="bg-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            
            <a href="/" class="text-2xl font-bold text-blue-600">
                <i class="fas fa-gavel"></i> Аукцион
            </a>
            
            <div class="flex space-x-4 items-center">
                
                {% if user.is_authenticated %}
                    <span class="text-gray-700">
                        Привет, 
                        <a href="{% url 'profile' %}" class="text-blue-600 hover:underline font-bold">
                            <i class="fas fa-user-circle"></i> {{ user.username }}
                        </a>!
                    </span>
                    
                    <form action="{% url 'logout' %}" method="POST" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-red-600 hover:text-red-800 font-medium hover:underline ml-2">
                            <i class="fas fa-sign-out-alt"></i> Выйти
                        </button>
                    </form>
                    
                {% else %}
                    <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800 font-medium hover:underline">
                        Войти
                    </a>
                    
                    <a href="{% url 'register' %}" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium transition-colors text-sm">
                        Регистрация
                    </a>
                {% endif %}
                
            </div>
        </div>
    </nav>

    {% if messages %}
        <div class="container mx-auto px-4 mt-4">
            {% for message in messages %}
                <div class="p-3 rounded shadow-sm {% if message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    
</body>
</html>
