{% extends 'main/base.html' %} {% block title %}Вход{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Вход в личный кабинет</h2>
    
    <form method="POST">
        {% csrf_token %} <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 font-medium mt-6 transition-colors">
            Войти
        </button>
    </form>
    
    <div class="mt-4 text-center text-sm text-gray-600">
        Нет аккаунта? <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Создать аккаунт</a>
    </div>
</div>
{% endblock %}
