{% extends 'main/base.html' %} {% block title %}Регистрация{% endblock %} {% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Регистрация на Аукционе</h2>
    
    <form method="POST">
        {% csrf_token %} <div class="space-y-4">
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    
                    {{ field }}
                    
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.as_text }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 font-medium mt-6 transition-colors">
            Зарегистрироваться
        </button>
    </form>
    
    <div class="mt-4 text-center text-sm text-gray-600">
        Уже есть аккаунт? <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Войти</a>
    </div>
</div>
{% endblock %}
